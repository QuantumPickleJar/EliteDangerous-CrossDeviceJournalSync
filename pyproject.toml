[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "elite-journal-cloud"
version = "0.1.0a1"
description = "Independent, immutable cross-device Elite Dangerous journal archive"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "platformdirs>=4,<5", "filelock>=3.16,<4", "keyring>=25,<26", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-defusedxml>=0.7"]

[project.scripts]
journal-cloud = "elite_journal_cloud.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elite_journal_cloud"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"
